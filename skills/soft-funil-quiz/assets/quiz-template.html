<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz</title>
<style>
@font-face{font-family:Inter;src:url("fonts/Inter-Variable.ttf") format("truetype");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;margin:0;background:#fff;color:#111;line-height:1.55}main{max-width:740px;margin:auto;padding:28px 22px 60px}h1{font-size:clamp(25px,5vw,38px);line-height:1.2;overflow-wrap:anywhere}h2{line-height:1.25}button,input,textarea{font:inherit}button,.cta{display:block;border:1px solid #222;border-radius:10px;padding:14px 18px;max-width:100%;background:white;color:#111;text-decoration:none;cursor:pointer;overflow-wrap:anywhere}button{width:100%;text-align:left;margin:10px 0}.primary,.cta{background:#111;color:white;text-align:center;margin-top:22px}button[aria-pressed=true]{background:#eeeeee;border:2px solid #333333}.nav{display:flex;gap:12px}.nav button{width:auto;min-width:100px}input:not([type=checkbox]),textarea{width:100%;padding:12px;border:1px solid #555;border-radius:7px;margin:8px 0}input[type=checkbox]{width:22px;height:22px;vertical-align:middle}progress{width:100%;height:12px}.muted{color:#444;font-size:14px}.error{color:#a00000;font-weight:bold}.note{background:#f3f5f3;padding:15px;border-radius:9px}video{max-width:100%;max-height:65vh;width:100%}label{display:block;margin-top:16px}summary{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #333333;outline-offset:3px}#heading:focus{outline:none}[hidden]{display:none!important}
</style></head><body><main><p id="brand"></p><div id="progress-wrap"><p id="progress-text" class="muted"></p><progress id="progress" max="100" value="0"></progress></div><section id="screen" aria-live="polite"></section></main>
<script id="quiz-config" type="application/json">__QUIZ_CONFIG__</script>
<script>
'use strict';
const config=JSON.parse(document.querySelector('#quiz-config').textContent);
const screen=document.querySelector('#screen');
let answers={},position=0,contact=null,captureDone=false;
const el=(tag,text,attrs={})=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e};
function condition(c){if(!c)return true;const a=answers[c.question];if(c.op==='answered')return a!==undefined&&a!=='';if(a===undefined)return false;if(c.op==='eq')return a===c.value;if(c.op==='ne')return a!==c.value;if(c.op==='includes')return Array.isArray(a)&&a.includes(c.value);if(c.op==='gte')return Number(a)>=c.value;if(c.op==='lte')return Number(a)<=c.value;return false}
function activeSteps(){return config.steps.filter(s=>condition(s.when))}
function reconcile(){for(const s of config.steps){if(!condition(s.when))delete answers[s.id]}position=Math.min(position,activeSteps().length)}
function calculate(){const scores=Object.fromEntries(config.profiles.map(p=>[p.id,0]));for(const s of activeSteps()){const selected=Array.isArray(answers[s.id])?answers[s.id]:[answers[s.id]];for(const o of s.options||[])if(selected.includes(o.id))for(const[k,v]of Object.entries(o.scores||{}))scores[k]+=v}const max=Math.max(...Object.values(scores));const tied=config.tieOrder.filter(id=>scores[id]===max);const profile=config.profiles.find(p=>p.id===tied[0]);const eligible=(config.eligibility?.all||[]).every(condition);return{profile,scores,tied,eligible}}
function addHeading(t){screen.append(el('h1',t,{id:'heading',tabindex:'-1'}))}
function para(t,cls){if(t)screen.append(el('p',t,cls?{class:cls}:{}))}
function btn(t,f,cls){const b=el('button',t,{type:'button',...(cls?{class:cls}:{})});b.onclick=f;screen.append(b);return b}
function error(t){let e=screen.querySelector('.error');if(!e){e=el('p','',{class:'error',role:'alert'});screen.append(e)}e.textContent=t}
function back(){if(position>0){position--;render()}}
function addBack(){if(position>0)btn('Voltar',back)}
function advance(){captureDone=false;contact=null;position++;render()}
function media(m){if(!m)return;screen.append(el('h2',m.title));if(m.src){const v=el('video',undefined,{controls:'',preload:'metadata','aria-label':m.title});v.src=m.src;if(m.poster)v.poster=m.poster;if(m.captions){const t=el('track',undefined,{kind:'captions',src:m.captions,srclang:'pt-BR',label:'Português',default:''});v.append(t)}v.onerror=()=>{const p=el('p','O vídeo não carregou. Leia a versão em texto abaixo.',{class:'note',role:'status'});v.replaceWith(p)};screen.append(v)}else screen.append(el('p',m.absentText||'Vídeo ainda não disponível. A explicação está em texto abaixo.',{class:'note','data-testid':'media-absent'}));screen.append(el('p',m.transcript));}
function showStep(s){addHeading(s.title);para(s.description);if(['info','video'].includes(s.type)){if(s.body)para(s.body);if(s.type==='video')media(s.media);btn('Continuar',advance,'primary');addBack();return}
 if(['single','multi'].includes(s.type)){if(s.type==='multi')para(`Escolha de ${s.minSelect||1} a ${s.maxSelect||s.options.length} opções.`,'muted');for(const o of s.options){const selected=s.type==='single'?answers[s.id]===o.id:(answers[s.id]||[]).includes(o.id);btn(o.label,()=>{if(s.type==='single')answers[s.id]=o.id;else{let a=answers[s.id]||[];if(a.includes(o.id))a=a.filter(v=>v!==o.id);else{if(a.length>=(s.maxSelect||s.options.length)){error('Você já marcou o limite de opções.');return}a=[...a,o.id]}answers[s.id]=a}reconcile();render()},'option').setAttribute('aria-pressed',String(selected))}}
 else{const label=el('label',s.label||s.title,{for:'answer'});screen.append(label);const i=el(s.type==='text'?'textarea':'input',undefined,{id:'answer',...(s.type==='number'?{type:'number'}:{})});if(s.type==='number'){if(s.min!==undefined)i.min=s.min;if(s.max!==undefined)i.max=s.max;i.step=s.step||'any';if(s.unit)para('Unidade: '+s.unit,'muted')}else i.maxLength=s.maxLength||500;i.value=answers[s.id]??'';i.oninput=()=>{if(s.type==='number')answers[s.id]=i.value===''?undefined:Number(i.value);else answers[s.id]=i.value;reconcile()};screen.append(i)}
 btn('Continuar',()=>{let a=answers[s.id];if(s.type==='single'&&!s.options.some(o=>o.id===a)){error('Escolha uma opção para continuar.');return}if(s.type==='multi'&&(!a||a.length<(s.minSelect||1))){error('Marque a quantidade indicada de opções.');return}if(s.type==='number'&&(!Number.isFinite(a)||!screen.querySelector('#answer').checkValidity()||(s.min!==undefined&&a<s.min)||(s.max!==undefined&&a>s.max))){error('Informe um número válido dentro da faixa indicada.');return}if(s.type==='text'&&s.required!==false&&!(a||'').trim()){error('Preencha a resposta para continuar.');return}advance()},'primary');addBack();}
function showCapture(){addHeading(config.capture.title);para(config.capture.purpose);para('Demonstração local: o contato fica somente na memória desta página. Nenhum dado será enviado.','note');const form=el('form');const label=el('label',config.capture.label,{for:'contact'});const i=el('input',undefined,{id:'contact',type:config.capture.field==='email'?'email':'tel',autocomplete:'off',required:''});form.append(label,i);const consent=el('input',undefined,{type:'checkbox',id:'consent',required:''});const consentLabel=el('label',config.capture.consent,{for:'consent'});consentLabel.prepend(consent);form.append(consentLabel);const submit=el('button','Ver resultado com o contato nesta sessão',{type:'submit',class:'primary'});form.append(submit);form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;contact=i.value;captureDone=true;render()};screen.append(form);btn('Continuar sem contato',()=>{contact=null;captureDone=true;render()});addBack();}
function showResult(){const r=calculate(),p=r.profile;addHeading(p.title);screen.dataset.profile=p.id;screen.dataset.eligible=String(r.eligible);para(p.body);if(r.tied.length>1)para(config.tieText,'note');screen.append(el('h2','Suas respostas'));const ul=el('ul');for(const s of activeSteps()){const a=answers[s.id];if(a===undefined)continue;let value=a;if(s.options){const ids=Array.isArray(a)?a:[a];value=s.options.filter(o=>ids.includes(o.id)).map(o=>o.label).join('; ')}ul.append(el('li',s.title+': '+value+(s.unit?' '+s.unit:'')))}screen.append(ul);if(config.capture.mode==='local'&&captureDone)para(contact?'Contato mantido apenas nesta sessão. Nenhum envio realizado.':'Você continuou sem informar contato.','muted');if(config.qualification?.length){para('Veja a apresentação e confira abaixo a adequação ao próximo passo.','muted')}
 media(p.media||config.resultMedia);para(p.recommendation);if(!config.qualification?.length)showDestination(r);else{screen.append(el('h2',config.qualificationTitle||'Confira se a conversa atende sua situação'));let allAnswered=true;for(const q of config.qualification){const fieldset=el('fieldset');fieldset.append(el('legend',q.title));for(const o of q.options){const b=el('button',o.label,{type:'button','aria-pressed':String(answers[q.id]===o.id)});b.onclick=()=>{answers[q.id]=o.id;render()};fieldset.append(b)}screen.append(fieldset);if(answers[q.id]===undefined)allAnswered=false}if(allAnswered)showDestination(calculate());else para('Responda à qualificação para ver o próximo passo.','muted')}
 addBack();btn('Recomeçar e limpar respostas',()=>{answers={};position=0;contact=null;captureDone=false;render()});}
function showDestination(r){let target=r.eligible?(r.profile.destination||config.destination):config.ineligible.destination;para(r.eligible?config.offer:config.ineligible.message);if(target?.url){const a=el('a',target.label,{class:'cta',href:target.url,'data-testid':'cta'});a.rel='noopener';screen.append(a)}else para(target?.pendingText||'O destino ainda precisa ser confirmado. Nenhum envio ou agendamento foi realizado.','note');}
function render(){reconcile();screen.replaceChildren();delete screen.dataset.profile;delete screen.dataset.eligible;document.title=config.title;document.querySelector('#brand').textContent=config.brand;const steps=activeSteps();const done=position>=steps.length;const capture=config.capture.mode==='local'&&!captureDone;document.querySelector('#progress-text').textContent=done?(capture?'Respostas concluídas; contato opcional':'Respostas concluídas'):`Tela ${position+1} de ${steps.length} no caminho atual`;document.querySelector('#progress').value=done?100:Math.round(position/steps.length*100);if(!done)showStep(steps[position]);else if(capture)showCapture();else showResult();screen.querySelector('#heading')?.focus({preventScroll:true});window.scrollTo(0,0)}
render();
</script></body></html>
