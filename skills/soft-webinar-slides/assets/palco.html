<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
/* O palco: tela 1920x1080 que escala, revelação por clique, notas (tecla N) e impressão.
   A identidade do dono entra só como variável (o script preenche a partir do perfil).
   {{CSS}} recebe o molde.css (rascunho de texto) ou o CSS de cada slide desenhado. */
:root {
/*{{VARS}}*/
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
.palco { position: fixed; inset: 0; overflow: hidden; background: #000; }
.deck { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
.slide {
  position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
  visibility: hidden; opacity: 0; pointer-events: none;
  font-family: var(--fonte); background: var(--bg); color: var(--ink);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
.slide.claro { --bg: var(--fundo-claro); --ink: var(--tinta-clara); --dim: var(--apagado-claro); --dest: var(--destaque-claro); --linha: var(--linha-claro); --suave: var(--suave-claro); --dest-suave: var(--dest-suave-claro); }
.slide.escuro { --bg: var(--fundo-escuro); --ink: var(--tinta-escura); --dim: var(--apagado-escuro); --dest: var(--destaque-escuro); --linha: var(--linha-escuro); --suave: var(--suave-escuro); --dest-suave: var(--dest-suave-escuro); }
aside.notes { display: none; }

/* Revelação por clique: opacidade e deslocamento, o layout nunca muda de lugar */
.reveal { opacity: 0; transition: opacity .45s var(--ease), transform .45s var(--ease); }
.reveal[data-fx="subir"] { transform: translateY(36px); }
.reveal[data-fx="riscar"] .risco-linha { transform-origin: left center; transform: scaleX(0); transition: transform .5s var(--ease); }
.reveal[data-fx="selo"] { transform: scale(.3); }
.reveal.on { opacity: 1; transform: none; }
.reveal.on[data-fx="riscar"] .risco-linha { transform: scaleX(1); }

/* Peças com papel fixo (o checar_deck.py conhece estas classes) */
.dest { color: var(--dest); }
b, strong { font-weight: 800; }
.risco { position: relative; display: inline-block; }
.risco-wrap { position: absolute; left: -10px; right: -10px; top: 50%; height: 0; }
.risco-rot { position: absolute; inset: 0; transform: rotate(-6deg); }
.risco-linha { position: absolute; left: 0; right: 0; top: -5px; height: 10px; background: var(--reservada); border-radius: 5px; }
.tarja { position: absolute; top: 0; right: 120px; background: var(--reservada); color: #fff; font-size: 32px; font-weight: 800; letter-spacing: 1px; padding: 18px 34px; border-radius: 0 0 14px 14px; text-transform: uppercase; z-index: 3; }
.rot-bonus { font-size: 30px; font-weight: 800; color: #fff; background: var(--reservada); border-radius: 8px; padding: 4px 12px; letter-spacing: 1px; }
.pct { font-family: var(--fonte-acao); font-size: 40px; font-weight: 800; color: #fff; background: var(--acao); border-radius: 999px; padding: 10px 28px; white-space: nowrap; }
.acao-pilula { display: inline-block; font-family: var(--fonte-acao); font-size: 38px; font-weight: 700; color: #fff; background: var(--acao); border-radius: 999px; padding: 14px 40px; }
.marca { position: absolute; right: 120px; bottom: 40px; font-size: 30px; color: var(--dim); }

/*{{CSS}}*/

/* notas do apresentador na tela: tecla N */
#painel-notas { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38vh; overflow: auto; background: rgba(10,10,10,.94); color: #eee;
  font: 18px/1.45 system-ui, sans-serif; padding: 18px 28px; white-space: pre-wrap; z-index: 50; display: none; }
#painel-notas.on { display: block; }
@media print {
  html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
  .palco { position: static; overflow: visible; }
  .deck { position: static; transform: none !important; width: auto; height: auto; }
  .slide { position: relative; visibility: visible !important; opacity: 1 !important; break-after: page; }
  .reveal { opacity: 1 !important; transform: none !important; }
  .reveal .risco-linha { transform: none !important; }
  #painel-notas { display: none !important; }
}
</style>
</head>
<body>
<div class="palco"><div class="deck">
<!--{{SLIDES}}-->
</div></div>
<div id="painel-notas"></div>
<script>
(function () {
  const slides = [...document.querySelectorAll('.slide')];
  const deckEl = document.querySelector('.deck');
  let cur = 0, step = 0;
  const maxStep = (s) => Math.max(0, ...[...s.querySelectorAll('[data-click]')].map((e) => +e.dataset.click));
  function fit() {
    const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    deckEl.style.transform = `translate(${(window.innerWidth - 1920 * k) / 2}px, ${(window.innerHeight - 1080 * k) / 2}px) scale(${k})`;
  }
  // Encolhe texto que não coube, nunca abaixo do piso (data-min, padrão 24px)
  function autofit() {
    slides.forEach((s) => {
      const vis = s.style.visibility; s.style.visibility = 'visible';
      s.querySelectorAll('.fit').forEach((el) => {
        const min = +(el.dataset.min || 24);
        let fs = parseFloat(getComputedStyle(el).fontSize);
        let guard = 0;
        while ((el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2) && fs > min && guard++ < 80) {
          fs -= 2; el.style.fontSize = Math.max(min, fs) + 'px';
        }
      });
      s.style.visibility = vis;
    });
  }
  function render() {
    slides.forEach((s, i) => { s.classList.toggle('active', i === cur); });
    const s = slides[cur];
    s.querySelectorAll('[data-click]').forEach((e) => e.classList.toggle('on', +e.dataset.click <= step));
    const n = s.querySelector('aside.notes');
    document.getElementById('painel-notas').textContent = `Slide ${cur + 1}/${slides.length} · clique ${step}/${maxStep(s)}\n\n` + (n ? n.textContent.trim() : '');
    if (history.replaceState) history.replaceState(null, '', '#' + (cur + 1));
  }
  function next() { if (step < maxStep(slides[cur])) step++; else if (cur < slides.length - 1) { cur++; step = 0; } render(); }
  function prev() { if (step > 0) step--; else if (cur > 0) { cur--; step = maxStep(slides[cur]); } render(); }
  window.deck = {
    count: slides.length,
    cliques: (i) => maxStep(slides[i]),
    show(i, k) { cur = Math.max(0, Math.min(slides.length - 1, i)); step = (k === undefined || k === 'final') ? maxStep(slides[cur]) : k; render(); },
    next, prev,
  };
  // Deck longo: número + Enter pula pro slide (ex.: 4 2 Enter); Home e End vão ao primeiro e ao último
  let numero = '';
  document.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) { numero += e.key; return; }
    if (e.key === 'Enter' && numero) { e.preventDefault(); window.deck.show(parseInt(numero, 10) - 1, 0); numero = ''; return; }
    numero = '';
    if (e.key === 'Home') { e.preventDefault(); window.deck.show(0, 0); }
    else if (e.key === 'End') { e.preventDefault(); window.deck.show(slides.length - 1, 0); }
    else if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'n' || e.key === 'N') document.getElementById('painel-notas').classList.toggle('on');
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('#painel-notas')) next(); });
  window.addEventListener('resize', fit);
  const h = parseInt((location.hash || '#1').slice(1), 10);
  cur = isNaN(h) ? 0 : Math.max(0, Math.min(slides.length - 1, h - 1));
  fit(); autofit(); render();
  window.deckPronto = true;
})();
</script>
</body>
</html>
