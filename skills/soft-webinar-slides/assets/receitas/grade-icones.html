<!-- RECEITA grade-icones (guia: regras 3 e 8; "desculpas nomeadas", "o que você vai ver", lista que vira imagem)
O que faz: cada item da lista ganha um ícone grande (emoji ou SVG) que diz o mesmo que a frase, um por clique,
lido de cima pra baixo. A conclusão entra por último, na cor de destaque.
Adapte: até 4 itens; o ícone tem que bater com a fala (regra 7: metáfora só se bater); a frase de cada item é do roteiro.
Emoji renderiza com a fonte de emoji da máquina; no PowerPoint fica a do computador do dono. Ícone SVG é igual em todo lugar.
Nunca: três itens lado a lado que obrigam o olho a varrer; ícone de enfeite. -->
<section class="slide claro" data-nome="{{NOME}}" data-bloco="{{BLOCO}}">
<style>
.quadro { position: absolute; inset: 100px 140px; display: flex; flex-direction: column; justify-content: center; }
.frase { font-size: 68px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.06; margin-bottom: 46px; max-width: 1500px; }
.it { display: flex; align-items: center; gap: 36px; margin-bottom: 26px; }
.ic { flex: 0 0 120px; height: 120px; border-radius: 28px; background: var(--dest-suave); display: flex; align-items: center; justify-content: center; font-size: 72px; line-height: 1; }
.tx { font-size: 48px; line-height: 1.18; font-weight: 700; }
.fecho { font-size: 52px; font-weight: 800; color: var(--dest); margin-top: 26px; }
</style>
<div class="quadro">
  <div class="frase">{{FRASE_CURTA}}</div>
  <div class="it" data-click="1"><div class="ic">{{EMOJI_1}}</div><div class="tx">{{ITEM_1}}</div></div>
  <div class="it" data-click="2"><div class="ic">{{EMOJI_2}}</div><div class="tx">{{ITEM_2}}</div></div>
  <div class="it" data-click="3"><div class="ic">{{EMOJI_3}}</div><div class="tx">{{ITEM_3}}</div></div>
  <div class="fecho" data-click="4">{{CONCLUSAO}}</div>
</div>
<aside class="notes">Objetivo: {{OBJETIVO}}
Abre com: {{ABRE_COM}}
Clique 1: {{FALA_CLIQUE_1}}
Clique 2: {{FALA_CLIQUE_2}}
Clique 3: {{FALA_CLIQUE_3}}
Clique 4: {{FALA_CLIQUE_4}}
Fecha com: {{FECHA_COM}}</aside>
</section>
