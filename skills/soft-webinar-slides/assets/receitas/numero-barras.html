<!-- RECEITA numero-barras (guia: regra 6 e "número grande ou conta": comparação que se vê)
O que faz: cada número do roteiro vira uma barra com o rótulo à esquerda e o valor na ponta; uma barra por clique;
a barra que importa na cor de destaque; a conclusão por último.
Adapte: uma .linha por número do roteiro (até 6); data-valor = o número puro (o script faz a largura proporcional);
o texto da ponta é o valor como o roteiro escreve, com a unidade. A conta aparece rápido, não precisa ficar parada.
Nunca: barra sem número do roteiro, eixo inventado, valor arredondado que muda o rótulo. -->
<section class="slide claro" data-nome="{{NOME}}" data-bloco="{{BLOCO}}">
<style>
.quadro { position: absolute; inset: 110px 140px; display: flex; flex-direction: column; justify-content: center; }
.frase { font-size: 76px; line-height: 1.06; font-weight: 800; letter-spacing: -2px; max-width: 1500px; margin-bottom: 64px; }
.linhas { display: flex; flex-direction: column; gap: 30px; }
.linha { display: flex; align-items: center; gap: 36px; }
.rot { flex: 0 0 360px; font-size: 36px; line-height: 1.15; font-weight: 700; }
.trilho { flex: 1; height: 96px; display: flex; align-items: center; }
.barra { height: 96px; border-radius: 14px; background: var(--linha); flex: 0 0 auto; }
.trilho span { font-size: 44px; font-weight: 800; color: var(--ink); white-space: nowrap; margin-left: 26px; }
.forte .barra { background: var(--dest); }
.forte .trilho span { color: var(--dest); }
.fecho { font-size: 48px; font-weight: 800; color: var(--dest); margin-top: 56px; }
</style>
<div class="quadro">
  <div class="frase">{{FRASE_CURTA}}</div>
  <div class="linhas">
    <div class="linha" data-click="1"><div class="rot">{{ROTULO_1}}</div><div class="trilho"><div class="barra" data-valor="{{VALOR_1}}"></div><span>{{TEXTO_1}}</span></div></div>
    <div class="linha" data-click="2"><div class="rot">{{ROTULO_2}}</div><div class="trilho"><div class="barra" data-valor="{{VALOR_2}}"></div><span>{{TEXTO_2}}</span></div></div>
    <div class="linha forte" data-click="3"><div class="rot">{{ROTULO_3}}</div><div class="trilho"><div class="barra" data-valor="{{VALOR_3}}"></div><span>{{TEXTO_3}}</span></div></div>
  </div>
  <div class="fecho" data-click="4">{{CONCLUSAO}}</div>
</div>
<script>
(function () {
  const q = document.currentScript.previousElementSibling, bs = [...q.querySelectorAll('.barra[data-valor]')];
  const mx = Math.max(...bs.map(b => +b.dataset.valor));
  bs.forEach(b => { b.style.width = Math.max(2, 74 * (+b.dataset.valor) / mx) + '%'; });
})();
</script>
<aside class="notes">Objetivo: {{OBJETIVO}}
Abre com: {{ABRE_COM}}
Clique 1: {{FALA_CLIQUE_1}}
Clique 2: {{FALA_CLIQUE_2}}
Clique 3: {{FALA_CLIQUE_3}}
Clique 4: {{FALA_CLIQUE_4}}
Fecha com: {{FECHA_COM}}</aside>
</section>
